services:
  backend:
    build:
      context: ./backend
    container_name: enterprise-rag-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-enterprise-kb-rag-chatbot}
      APP_ENV: ${APP_ENV:-development}
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-knowledge_base}
    ports:
      - "8000:8000"
    depends_on:
      chromadb:
        condition: service_started
      ollama-models:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: enterprise-rag-frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  ollama:
    image: ollama/ollama:latest
    container_name: enterprise-rag-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  ollama-models:
    image: ollama/ollama:latest
    container_name: enterprise-rag-ollama-models
    restart: "no"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$$AI_PROVIDER" = "openai" ]; then
          echo "AI_PROVIDER=openai; skipping Ollama model downloads"
        else
          ollama pull "$$OLLAMA_CHAT_MODEL" &&
          ollama pull "$$OLLAMA_EMBEDDING_MODEL"
        fi
    depends_on:
      ollama:
        condition: service_healthy

  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: enterprise-rag-chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data

volumes:
  chroma_data:
  frontend_node_modules:
  ollama_data:
